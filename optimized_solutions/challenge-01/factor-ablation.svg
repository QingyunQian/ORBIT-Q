<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Task 01 factor ablation</title>
  <desc id="desc">Incremental paired speedups for eleven tested factors and the cumulative end-to-end result.</desc>
  <rect width="960" height="620" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .muted { fill: #5c667a; }
    .grid { stroke: #d9deea; stroke-width: 1; }
  </style>
  <text x="34" y="36" font-size="22" font-weight="600">Task 01 factor ablation</text>
  <text x="34" y="59" font-size="13" class="muted">Individual factors are incremental vs their parent; final is cumulative vs the expert</text>

  <line x1="280" y1="75" x2="280" y2="570" class="grid"/>
  <line x1="400" y1="75" x2="400" y2="570" class="grid"/>
  <line x1="520" y1="75" x2="520" y2="570" class="grid"/>
  <line x1="640" y1="75" x2="640" y2="570" class="grid"/>
  <line x1="760" y1="75" x2="760" y2="570" class="grid"/>
  <line x1="880" y1="75" x2="880" y2="570" class="grid"/>
  <line x1="340" y1="75" x2="340" y2="570" stroke="#667085" stroke-width="1.5" stroke-dasharray="5 5"/>

  <text x="265" y="99" text-anchor="end" font-size="12">E01 · TFIM MPO</text>
  <rect x="280" y="87" width="90.7" height="16" rx="3" fill="#138a72"/><text x="377" y="99" font-size="11">1.512×</text>
  <text x="265" y="137" text-anchor="end" font-size="12">E02 · Training scan</text>
  <rect x="280" y="125" width="58.0" height="16" rx="3" fill="#c14b4b"/><text x="345" y="137" font-size="11">0.967×</text>
  <text x="265" y="175" text-anchor="end" font-size="12">E03 · Layer fusion</text>
  <rect x="280" y="163" width="93.7" height="16" rx="3" fill="#138a72"/><text x="380" y="175" font-size="11">1.562×</text>
  <text x="265" y="213" text-anchor="end" font-size="12">E04 · OMECo 1x1</text>
  <rect x="280" y="201" width="66.2" height="16" rx="3" fill="#138a72"/><text x="353" y="213" font-size="11">1.104×</text>
  <text x="265" y="251" text-anchor="end" font-size="12">E05 · OMECo 4x4</text>
  <rect x="280" y="239" width="60.9" height="16" rx="3" fill="#c14b4b"/><text x="348" y="251" font-size="11">1.015×</text>
  <text x="265" y="289" text-anchor="end" font-size="12">E06 · Greedy screen</text>
  <rect x="280" y="277" width="51.1" height="16" rx="3" fill="#c14b4b"/><text x="338" y="289" font-size="11">0.851×</text>
  <text x="265" y="327" text-anchor="end" font-size="12" font-weight="600">E07 · Batched gates</text>
  <rect x="280" y="315" width="214.5" height="16" rx="3" fill="#138a72"/><text x="502" y="327" font-size="12" font-weight="600">3.575×</text>
  <text x="265" y="365" text-anchor="end" font-size="12">E08 · Within-layer batch</text>
  <rect x="280" y="353" width="62.3" height="16" rx="3" fill="#c14b4b"/><text x="349" y="365" font-size="11">1.038×</text>
  <text x="265" y="403" text-anchor="end" font-size="12">E09 · Scan retest</text>
  <rect x="280" y="391" width="61.0" height="16" rx="3" fill="#c14b4b"/><text x="348" y="403" font-size="11">1.017×</text>
  <text x="265" y="441" text-anchor="end" font-size="12">E10 · Global batching</text>
  <rect x="280" y="429" width="64.8" height="16" rx="3" fill="#138a72"/><text x="352" y="441" font-size="11">1.079×</text>
  <text x="265" y="479" text-anchor="end" font-size="12">E11 · Algebraic primitives</text>
  <rect x="280" y="467" width="72.3" height="16" rx="3" fill="#c14b4b"/><text x="359" y="479" font-size="11">1.205×</text>

  <line x1="34" y1="504" x2="916" y2="504" class="grid"/>
  <text x="265" y="540" text-anchor="end" font-size="13" font-weight="600">Final cumulative</text>
  <rect x="280" y="526" width="578.2" height="19" rx="3" fill="#315b8a"/><text x="867" y="540" font-size="13" font-weight="600">9.636×</text>

  <text x="280" y="590" text-anchor="middle" font-size="11" class="muted">0×</text>
  <text x="400" y="590" text-anchor="middle" font-size="11" class="muted">2×</text>
  <text x="520" y="590" text-anchor="middle" font-size="11" class="muted">4×</text>
  <text x="640" y="590" text-anchor="middle" font-size="11" class="muted">6×</text>
  <text x="760" y="590" text-anchor="middle" font-size="11" class="muted">8×</text>
  <text x="880" y="590" text-anchor="middle" font-size="11" class="muted">10×</text>
  <text x="34" y="611" font-size="11" class="muted">Dashed line: 1× no change · green: kept · red: discarded · blue: final cumulative</text>
</svg>
