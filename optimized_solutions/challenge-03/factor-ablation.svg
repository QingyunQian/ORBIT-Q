<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Task 03 factor ablation</title>
  <desc id="desc">Incremental paired speedups for four retained factors and the cumulative end-to-end result.</desc>
  <rect width="900" height="480" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .muted { fill: #5c667a; }
    .grid { stroke: #d9deea; stroke-width: 1; }
  </style>
  <text x="34" y="38" font-size="22" font-weight="600">Task 03 factor ablation</text>
  <text x="34" y="62" font-size="13" class="muted">Individual factors are incremental vs their parent; final is cumulative vs the expert</text>

  <line x1="290" y1="85" x2="290" y2="410" stroke="#667085" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="418" y1="85" x2="418" y2="410" class="grid"/>
  <line x1="546" y1="85" x2="546" y2="410" class="grid"/>
  <line x1="674" y1="85" x2="674" y2="410" class="grid"/>
  <line x1="802" y1="85" x2="802" y2="410" class="grid"/>
  <text x="290" y="434" text-anchor="middle" font-size="12" class="muted">1×</text>
  <text x="418" y="434" text-anchor="middle" font-size="12" class="muted">2×</text>
  <text x="546" y="434" text-anchor="middle" font-size="12" class="muted">3×</text>
  <text x="674" y="434" text-anchor="middle" font-size="12" class="muted">4×</text>
  <text x="802" y="434" text-anchor="middle" font-size="12" class="muted">5×</text>

  <text x="274" y="119" text-anchor="end" font-size="13" font-weight="600">Product-state reduction</text>
  <line x1="290" y1="115" x2="374" y2="115" stroke="#138a72" stroke-width="4"/>
  <circle cx="374" cy="115" r="7" fill="#138a72"/>
  <text x="386" y="119" font-size="13" font-weight="600">1.660×</text>

  <text x="274" y="179" text-anchor="end" font-size="13" font-weight="600">Vectorized local maps</text>
  <line x1="290" y1="175" x2="426" y2="175" stroke="#138a72" stroke-width="4"/>
  <circle cx="426" cy="175" r="7" fill="#138a72"/>
  <text x="438" y="179" font-size="13" font-weight="600">2.063×</text>

  <text x="274" y="239" text-anchor="end" font-size="12">TensorCircuit scans</text>
  <line x1="290" y1="235" x2="309" y2="235" stroke="#7c8a9f" stroke-width="3"/>
  <circle cx="309" cy="235" r="5" fill="#7c8a9f"/>
  <text x="319" y="239" font-size="12">1.149×</text>

  <text x="274" y="299" text-anchor="end" font-size="12">Vectorized observables</text>
  <line x1="290" y1="295" x2="302" y2="295" stroke="#7c8a9f" stroke-width="3"/>
  <circle cx="302" cy="295" r="5" fill="#7c8a9f"/>
  <text x="312" y="299" font-size="12">1.093×</text>

  <line x1="34" y1="329" x2="856" y2="329" class="grid"/>
  <text x="274" y="375" text-anchor="end" font-size="13" font-weight="600">Final cumulative</text>
  <line x1="290" y1="371" x2="730" y2="371" stroke="#315b8a" stroke-width="5"/>
  <polygon points="730,362 739,371 730,380 721,371" fill="#315b8a"/>
  <text x="745" y="375" font-size="13" font-weight="600">4.435×</text>

  <circle cx="34" cy="458" r="5" fill="#138a72"/>
  <text x="46" y="462" font-size="12">dominant factors</text>
  <circle cx="158" cy="458" r="5" fill="#7c8a9f"/>
  <text x="170" y="462" font-size="12">retained secondary factors</text>
</svg>
