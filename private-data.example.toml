# Shape reference for trusted-controller configuration.
# Keep the populated file outside every Git checkout and proposal-agent process.
# Do not place real paths, record IDs, hashes, seeds, keys, or tokens in this file.

schema_version = 1
status = "not_configured"
public_dataset_version = "REPLACE_AFTER_PUBLIC_DATASET_BUILD"

[measurement]
minimum_repeats = 6
timeout_sec = 300
pair_order = "REPLACE_WITH_PREDECLARED_ORDER"
confidence_method = "REPLACE_WITH_METHOD_DECLARED_IN_SURVEY"

[controller]
service_identity = "REPLACE_IN_CONTROLLER_STORAGE"
redact_private_paths = true
redact_record_ids = true
redact_seeds = true
redact_hashes = true
redact_keys = true
return_fields = [
  "valid",
  "timed_out",
  "passing_runs",
  "mean_runtime_sec",
  "median_runtime_sec",
  "runtime_stderr_sec",
  "paired_improvement_pct",
  "paired_improvement_stderr",
  "paired_speedup_mean",
  "paired_speedup_median",
  "paired_speedup_stderr",
  "paired_speedup_ci_low",
  "paired_speedup_ci_high",
]

[hidden_tuning]
status = "required"
dataset_version = "REPLACE_IN_CONTROLLER_STORAGE"
records_location = "CONTROLLER_ONLY"
manifest_sha256 = "CONTROLLER_ONLY"
credential_reference = "CONTROLLER_ONLY"
rotation_policy = "REPLACE_IN_CONTROLLER_STORAGE"
minimum_rotations_per_task = 2

[sealed_holdout]
status = "required"
dataset_version = "REPLACE_IN_CONTROLLER_STORAGE"
records_location = "CONTROLLER_ONLY"
manifest_sha256 = "CONTROLLER_ONLY"
credential_reference = "CONTROLLER_ONLY"
max_evaluations_per_candidate = 1
allow_proposal_agent_query = false
